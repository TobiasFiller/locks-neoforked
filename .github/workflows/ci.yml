name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: locks_neoforked-jar
          path: build/libs/locks_neoforked-*.jar
          if-no-files-found: error
