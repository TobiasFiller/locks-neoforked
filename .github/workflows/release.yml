name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Read version from gradle.properties
        id: version
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1 | tr -d '\r')"
          if [[ -z "$version" ]]; then
            echo "::error::mod_version is empty in gradle.properties"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.value }}"
          awk -v tag="$version" '
            { sub(/\r$/, "") }
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::No '## $version' section found in CHANGELOG.md"
            exit 1
          fi

      - name: Verify JAR
        run: |
          jar="build/libs/locks_neoforked-${{ steps.version.outputs.value }}.jar"
          if [[ ! -f "$jar" ]]; then
            echo "::error::Expected JAR not found: $jar"
            exit 1
          fi

      - name: Publish to GitHub Releases and CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.value }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: false
          curseforge-id: 1767458
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/locks_neoforked-${{ steps.version.outputs.value }}.jar
          name: Locks Neoforked ${{ steps.version.outputs.value }} (NeoForge 1.21.1)
          version: ${{ steps.version.outputs.value }}
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: 1.21.1
          environment: "client | server"
