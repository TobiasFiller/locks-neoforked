plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
    gradleVersion = '8.14.3'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'locks_reforged'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

// Carry On compatibility is optional and compiled only when its jar is vendored under libs/ (gitignored).
ext.carryOnJar = file('libs/carryon-neoforge-1.21.1-2.2.2.jar')
ext.hasCarryOn = carryOnJar.exists()
ext.requireCarryOn = project.hasProperty('requireCarryOn') && Boolean.parseBoolean(project.property('requireCarryOn').toString())
if (!hasCarryOn && requireCarryOn)
    throw new GradleException("requireCarryOn is set but ${carryOnJar} is missing - this build would ship without Carry On compatibility.")
if (!hasCarryOn)
    logger.lifecycle("Carry On jar not found at ${carryOnJar} - building without Carry On compatibility.")

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'mixin.env.remapRefMap', 'true'
        modSource project.sourceSets.main
    }

    client {}

    server {
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory.get().asFile

if (!hasCarryOn) {
    sourceSets.main.java { exclude 'melonslise/locks/mixin/carryon/**' }
    processResources { exclude 'locks_carryon.mixins.json' }
}

repositories {
    maven {
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly 'com.google.guava:guava:32.1.2-jre'
    compileOnly 'it.unimi.dsi:fastutil:8.5.12'
    compileOnly 'org.joml:joml:1.10.5'
    compileOnly 'org.apache.commons:commons-lang3:3.14.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}:api"

    if (project.hasCarryOn) {
        compileOnly "io.github.llamalad7:mixinextras-common:0.4.0"
        compileOnly "blank:carryon-neoforge-1.21.1:2.2.2"
        localRuntime "blank:carryon-neoforge-1.21.1:2.2.2"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            has_carryon            : project.hasCarryOn
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : project.mod_id,
            "Specification-Vendor"    : project.mod_authors,
            "Specification-Version"   : project.mod_version,
            "Implementation-Title"    : project.mod_id,
            "Implementation-Version"  : project.mod_version,
            "Implementation-Vendor"   : project.mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
